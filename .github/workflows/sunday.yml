# Fires Thursday 15:30 UTC = Thursday 8:30am PDT = exactly 72h before Sunday 8:30am
# Winter PST: change 15:30 → 16:30
name: Register Sunday Badminton
on:
  schedule:
    - cron: '30 15 * * 4'
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Register
        env:
          SURREY_EMAIL: ${{ secrets.SURREY_EMAIL }}
          SURREY_PASSWORD: ${{ secrets.SURREY_PASSWORD }}
        run: python register.py --day sunday
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sunday
          path: debug_screenshot.png
          if-no-files-found: ignore
