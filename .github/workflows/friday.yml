# Fires Tuesday 00:00 UTC = Monday 5:00pm PDT = exactly 72h before Friday 5:00pm
# Winter PST: change 00:00 → 01:00
name: Register Friday Badminton
on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Register
        env:
          SURREY_EMAIL: ${{ secrets.SURREY_EMAIL }}
          SURREY_PASSWORD: ${{ secrets.SURREY_PASSWORD }}
        run: python register.py --day friday
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-friday
          path: debug_screenshot.png
          if-no-files-found: ignore
