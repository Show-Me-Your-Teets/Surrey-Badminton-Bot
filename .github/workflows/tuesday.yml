# Fires Saturday 01:30 UTC = Saturday 6:30pm PDT = exactly 72h before Tuesday 6:30pm
# Winter PST: change 01:30 → 02:30
name: Register Tuesday Badminton
on:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Register
        env:
          SURREY_EMAIL: ${{ secrets.SURREY_EMAIL }}
          SURREY_PASSWORD: ${{ secrets.SURREY_PASSWORD }}
        run: python register.py --day tuesday
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-tuesday
          path: debug_screenshot.png
          if-no-files-found: ignore
