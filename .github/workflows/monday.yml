# Fires Friday 01:45 UTC = Friday 6:45pm PDT = exactly 72h before Monday 6:45pm
# Winter PST: change 01:45 → 02:45
name: Register Monday Badminton
on:
  schedule:
    - cron: '45 1 * * 5'
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Register
        env:
          SURREY_EMAIL: ${{ secrets.SURREY_EMAIL }}
          SURREY_PASSWORD: ${{ secrets.SURREY_PASSWORD }}
        run: python register.py --day monday
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-monday
          path: debug_screenshot.png
          if-no-files-found: ignore
