name: Weekly Badminton Registration
on:
  schedule:
    # Every 5 minutes, around the clock. The script itself checks whether
    # any target session's 72h window is opening right now (Vancouver
    # time) and exits quickly if not — this avoids GH Actions' UTC-only
    # cron drifting across BC's DST changes twice a year.
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright pytz
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get install -y xvfb
      - name: Register (if any session is opening)
        env:
          SURREY_EMAIL: ${{ secrets.SURREY_EMAIL }}
          SURREY_PASSWORD: ${{ secrets.SURREY_PASSWORD }}
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python register_weekly.py
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-${{ github.run_id }}
          path: |
            weekly_*.png
            login.png
          if-no-files-found: ignore
