name: Weekly Badminton Registration
on:
  # Scheduling now handled externally by cron-job.org pinging the
  # workflow_dispatch API every minute - far more precise than GitHub's
  # own schedule: cron, which showed 15-40 minute real-world delays.
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore browser session state from previous run
        uses: actions/cache/restore@v4
        with:
          path: browser_state.json
          key: browser-state-${{ github.run_id }}
          restore-keys: |
            browser-state-
      - name: Install dependencies
        run: |
          pip install playwright pytz
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get install -y xvfb
      - name: Show runner egress IP + org (diagnostic)
        run: curl -s https://ipinfo.io/json
      - name: Register (if any session is opening)
        env:
          SURREY_EMAIL: ${{ secrets.SURREY_EMAIL }}
          SURREY_PASSWORD: ${{ secrets.SURREY_PASSWORD }}
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python register_weekly.py
      - name: Save browser session state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: browser_state.json
          key: browser-state-${{ github.run_id }}
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-${{ github.run_id }}
          path: |
            weekly_*.png
            login.png
          if-no-files-found: ignore
